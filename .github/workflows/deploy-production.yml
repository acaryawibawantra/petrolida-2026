name: Deploy Petrolida Production

on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Petrolida Frontend Prod
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            kkafi09/petrolida2026-fe:prod
            kkafi09/petrolida2026-fe:${{ github.sha }}
          cache-from: type=registry,ref=kkafi09/petrolida2026-fe:buildcache
          cache-to: type=registry,ref=kkafi09/petrolida2026-fe:buildcache,mode=max

      - name: Trigger Production Deployment
        run: |
          curl --request GET \
          "${{ secrets.DEPLOY_URL }}?uuid=${{ secrets.DEPLOY_UUID_PROD }}" \
          --header "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
          --header "X-Build-Version: ${{ github.sha }}" \
          --header "X-Environment: production"
        continue-on-error: true