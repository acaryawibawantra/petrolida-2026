name: Deploy Petrolida Development

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Petrolida Frontend Dev
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dev
          push: true
          tags: |
            kkafi09/petrolida2026-fe:dev
            kkafi09/petrolida2026-fe:dev-${{ github.sha }}
          cache-from: type=registry,ref=kkafi09/petrolida2026-fe:buildcache-dev
          cache-to: type=registry,ref=kkafi09/petrolida2026-fe:buildcache-dev,mode=max

      - name: Trigger Development Deployment
        run: |
          curl --request GET \
          "${{ secrets.DEPLOY_URL }}?uuid=${{ secrets.DEPLOY_UUID_DEV }}" \
          --header "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
          --header "X-Build-Version: ${{ github.sha }}" \
          --header "X-Environment: development"
        continue-on-error: true